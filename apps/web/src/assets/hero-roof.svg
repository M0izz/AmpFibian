<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Gradients -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EAF4F8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F6F7F4" stop-opacity="1"/>
    </linearGradient>

    <linearGradient id="solarRayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="coolRoofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <linearGradient id="slabGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>

    <linearGradient id="waterFlowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <linearGradient id="tankWaterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0369A1" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .sun-pulse { animation: rayPulse 3.5s ease-in-out infinite; }
    .water-flow-dash { stroke-dasharray: 8 6; animation: flowDash 1.2s linear infinite; }
    .tank-water-wave { animation: waterSway 4s ease-in-out infinite alternate; }
    @keyframes rayPulse {
      0%, 100% { opacity: 0.85; transform: scale(1); transform-origin: 150px 70px; }
      50% { opacity: 1; transform: scale(1.06); transform-origin: 150px 70px; }
    }
    @keyframes flowDash {
      to { stroke-dashoffset: -28; }
    }
    @keyframes waterSway {
      0% { transform: translateY(0); }
      100% { transform: translateY(-4px); }
    }
  </style>

  <!-- Background Canvas -->
  <rect width="800" height="480" fill="url(#skyGrad)" rx="16"/>

  <!-- Sun Element -->
  <g class="sun-pulse">
    <circle cx="150" cy="70" r="32" fill="#FBBF24" filter="url(#softGlow)"/>
    <circle cx="150" cy="70" r="26" fill="#F59E0B"/>
    <!-- Solar rays toward roof -->
    <line x1="170" y1="90" x2="310" y2="200" stroke="url(#solarRayGrad)" stroke-width="3" stroke-linecap="round"/>
    <line x1="185" y1="78" x2="380" y2="195" stroke="url(#solarRayGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="140" y1="105" x2="240" y2="205" stroke="url(#solarRayGrad)" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Reflected Solar Heat Vectors (Cool Roof Effect) -->
  <g>
    <path d="M 310 200 L 350 140" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 4"/>
    <path d="M 380 195 L 430 135" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 4"/>
    <!-- Arrowheads -->
    <polygon points="350,140 342,148 355,148" fill="#38BDF8"/>
    <polygon points="430,135 422,143 435,143" fill="#38BDF8"/>
    <text x="365" y="130" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#0284C7">82% High Albedo Reflection</text>
  </g>

  <!-- Main Building Structure Cross Section -->
  <g transform="translate(180, 200)">
    <!-- 1. Cool Roof High-Reflectance Coating Layer -->
    <rect x="0" y="0" width="440" height="10" rx="3" fill="url(#coolRoofGrad)" stroke="#CBD5E1" stroke-width="1"/>
    <text x="12" y="-8" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#176B4D">HIGH-ALBEDO COOL ROOF FINISH (SRI &gt; 104)</text>

    <!-- 2. Thermal XPS Insulation Underlay -->
    <rect x="0" y="10" width="440" height="18" fill="#FDE68A" stroke="#F59E0B" stroke-width="0.5"/>
    <text x="12" y="23" font-family="Inter, sans-serif" font-size="9" font-weight="600" fill="#92400E">50mm Extruded Polystyrene (XPS) Insulation (R = 1.78 m²·K/W)</text>

    <!-- 3. Reinforced Cement Concrete (RCC) Structural Slab -->
    <rect x="0" y="28" width="440" height="42" fill="url(#slabGrad)"/>
    <text x="12" y="52" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">150mm RCC Slab (Reduced Sol-Air Heat Flux)</text>

    <!-- 4. Top Floor Interior Ceiling Space -->
    <rect x="0" y="70" width="440" height="110" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    
    <!-- Interior Comfort Badge -->
    <rect x="140" y="105" width="160" height="40" rx="8" fill="#E8F4EC" stroke="#BFE2CB" stroke-width="1"/>
    <text x="220" y="123" font-family="Outfit, sans-serif" font-size="12" font-weight="700" fill="#176B4D" text-anchor="middle">−5.4°C Sol-Air Temp</text>
    <text x="220" y="137" font-family="Inter, sans-serif" font-size="9" font-weight="500" fill="#48534E" text-anchor="middle">Reduced Top-Floor Heat Gain</text>

    <!-- Downspout Rainwater Gutter & Interconnection -->
    <path d="M 440 5 L 475 5 L 475 180" fill="none" stroke="#64748B" stroke-width="6" stroke-linecap="round"/>
    <!-- Water Flow Stream inside gutter -->
    <path class="water-flow-dash" d="M 440 5 L 475 5 L 475 180" fill="none" stroke="url(#waterFlowGrad)" stroke-width="3"/>
  </g>

  <!-- Modular Rainwater Harvesting Tank -->
  <g transform="translate(640, 270)">
    <!-- Tank Body Cylinder -->
    <rect x="0" y="0" width="110" height="130" rx="14" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
    <!-- Water Level Inside Tank -->
    <rect class="tank-water-wave" x="3" y="32" width="104" height="95" rx="10" fill="url(#tankWaterGrad)"/>
    
    <!-- Water level label -->
    <text x="55" y="65" font-family="Outfit, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">40,000 L</text>
    <text x="55" y="80" font-family="Inter, sans-serif" font-size="9" font-weight="600" fill="#E0F2FE" text-anchor="middle">Modular Tank</text>

    <!-- First Flush Diversion Unit -->
    <rect x="-24" y="25" width="16" height="45" rx="4" fill="#E2E8F0" stroke="#64748B" stroke-width="1.5"/>
    <path d="M -16 10 L -16 25" stroke="#64748B" stroke-width="4"/>
    <path d="M -8 35 L 0 35" stroke="#0284C7" stroke-width="3"/>
    <text x="-16" y="80" font-family="Inter, sans-serif" font-size="8" font-weight="600" fill="#64748B" text-anchor="middle">First Flush</text>
  </g>

  <!-- Rain Drops Vector (Monsoon Inflow) -->
  <g stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round" opacity="0.75">
    <line x1="280" y1="120" x2="270" y2="150"/>
    <line x1="360" y1="110" x2="350" y2="140"/>
    <line x1="440" y1="130" x2="430" y2="160"/>
    <line x1="520" y1="115" x2="510" y2="145"/>
    <line x1="600" y1="125" x2="590" y2="155"/>
  </g>

  <!-- Engineering Annotation Strip -->
  <rect x="20" y="435" width="760" height="30" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="35" y="454" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#18211D">NBC 2016 Part 8 / IS 15797 / ASHRAE 90.1 Compliance</text>
  <text x="520" y="454" font-family="JetBrains Mono, monospace" font-size="10" font-weight="500" fill="#176B4D">365-Day Chronological Mass Balance</text>
</svg>
